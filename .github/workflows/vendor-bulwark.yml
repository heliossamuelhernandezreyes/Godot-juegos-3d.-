name: Vendor CC0 Bulwark rigged robot

on:
  push:
    branches: [feat/fisura-v08-cinematic-industrial]
    paths:
      - tools/vendor_bulwark.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Acquire CC0 Quaternius skinned heavy robot
        run: python3 tools/vendor_bulwark.py
      - name: Commit source-verified files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/quaternius/scifi_essentials/
          if ! git diff --cached --quiet; then
            git commit -m "assets: CC0 source-pinned heavy Trilobite enemy rig"
            git push origin HEAD:feat/fisura-v08-cinematic-industrial
          fi
