name: Vendor cinematic industrial 3D props

on:
  push:
    branches: [feat/fisura-v08-cinematic-industrial]
    paths:
      - 'tools/vendor_polyhaven_cinematic.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_cc0_models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download verified catalog assets and glTF dependencies
        run: python3 tools/vendor_polyhaven_cinematic.py
      - name: Commit the exact original 1K assets to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/polyhaven_cinematic
          if ! git diff --cached --quiet; then
            git commit -m 'assets: vendor Poly Haven CC0 industrial models with provenance'
            git push origin HEAD:feat/fisura-v08-cinematic-industrial
          else
            echo 'Poly Haven assets already committed'
          fi
