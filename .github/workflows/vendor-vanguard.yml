name: Vendor Vanguard humanoid

on:
  push:
    branches: [feat/fisura-v05-vanguard-humanoid]
    paths:
      - 'tools/vendor_vanguard.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify license and vendor rigged CC0 humanoid
        run: python3 tools/vendor_vanguard.py
      - name: Commit versioned assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/quaternius/vanguard_spacesuit/
          if ! git diff --cached --quiet; then
            git commit -m 'assets: source-pinned CC0 Vanguard humanoid with rig and animation provenance'
            git push origin HEAD:feat/fisura-v05-vanguard-humanoid
          fi
