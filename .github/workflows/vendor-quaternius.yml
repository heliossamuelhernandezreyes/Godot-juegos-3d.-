name: Vendor CC0 animated robots

on:
  push:
    branches: [feat/fisura-v04-animated-robots]
    paths:
      - 'tools/vendor_quaternius.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify CC0 license and download pinned glTFs, binary skinning, animation and PBR
        run: python3 tools/vendor_quaternius.py
      - name: Commit model bytes with provenance
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/quaternius/scifi_essentials
          if ! git diff --cached --quiet; then
            git commit -m 'assets: Quaternius CC0 animated robots and rifle with hashes'
            git push origin HEAD:feat/fisura-v04-animated-robots
          fi
