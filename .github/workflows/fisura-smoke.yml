name: FISURA smoke and ARCONT contract

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: heliossamuelhernandezreyes/Arcont
          ref: f9f9b3cfeef5f768257f21c4796b2a7653434b64
          path: _arcont_reference
      - name: Validate ARCONT 1.1 project intent against canonical schema
        run: |
          python3 -m pip install --disable-pip-version-check --quiet jsonschema==4.25.1
          python3 - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.loads(Path("_arcont_reference/schemas/project-intent.schema.json").read_text(encoding="utf-8"))
          intent = json.loads(Path("project.intent.json").read_text(encoding="utf-8"))
          arcont = json.loads(Path("_arcont_reference/arcont.manifest.json").read_text(encoding="utf-8"))
          fisura = json.loads(Path("fisura.manifest.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(intent)
          assert arcont["arcont_version"] == "1.1.0", "ARCONT pin does not contain v1.1"
          assert fisura["arcont"]["commit"] == "f9f9b3cfeef5f768257f21c4796b2a7653434b64"
          assert intent["project_id"] == "fisura"
          print("ARCONT 1.1 INTENT CONTRACT PASS (no MCP gateway started, no project write)")
          PY
      - name: Validate map with real ARCONT Map Forge validator
        run: python3 _arcont_reference/tools/map_forge_contract.py maps/crisol_01.json
      - name: Validate live Reactivo-13 Map Forge level geometry
        run: python3 _arcont_reference/tools/map_forge_contract.py maps/reactivo_13.json
      - name: Validate Reactivo-13 design mission with ARCONT cross-reference tool
        run: |
          python3 _arcont_reference/tools/vertical_slice_contract.py missions/reactivo_13.slice.json
          echo "DESIGN CONTRACT PASS: Reactivo-13 (gameplay/runtime NOT implemented)"
      - name: Validate gameplay anchors
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("maps/crisol_01.json").read_text(encoding="utf-8"))
          a = {x["id"]: x for x in m["anchors"]}
          for key in ("player_start", "core_alpha", "core_beta", "core_gamma", "exit_portal"):
              assert key in a, f"Missing gameplay anchor: {key}"
          assert len([x for x in m["anchors"] if x.get("team") == "enemy"]) >= 4
          assert Path("scenes/main.tscn").is_file()
          for file in ("scripts/game.gd", "scripts/player.gd", "scripts/enemy.gd"):
              assert Path(file).is_file()
          print("Game map, objectives and files: PASS")
          PY
      - name: Explore ARCONT CC0 Poly Haven model variants (nonblocking)
        run: python3 tools/probe_polyhaven.py || true
      - name: Download Godot 4.7.2 stable
        run: |
          curl --fail --location --retry 3 -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
      - name: Godot headless import and parse validation
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit > godot-import.log 2>&1
          cat godot-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|ERROR:" godot-import.log
      - name: Godot headless runtime smoke (120 frames)
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit-after 120 > godot-smoke.log 2>&1
          cat godot-smoke.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" godot-smoke.log
      - name: Audit all authored OBJ geometry imports
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/asset_audit.gd > asset-integrity.log 2>&1 || { cat asset-integrity.log; exit 1; }
          cat asset-integrity.log
          grep -q "ASSET INTEGRITY PASS" asset-integrity.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" asset-integrity.log
      - name: Audit vendored Poly Haven glTF scenes and texture import
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/vendor_asset_audit.gd > vendor-import.log 2>&1 || { cat vendor-import.log; exit 1; }
          cat vendor-import.log
          grep -q "VENDOR IMPORT PASS count=2" vendor-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" vendor-import.log
      - name: Audit source-traced Quaternius CC0 skeletal assets in Godot
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/quaternius_import.gd > quaternius-import.log 2>&1 || { cat quaternius-import.log; exit 1; }
          cat quaternius-import.log
          grep -q "SKELETAL ASSET PASS" quaternius-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" quaternius-import.log
      - name: Godot skeletal Vanguard source and clip gate
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/vanguard_import.gd > vanguard-import.log 2>&1 || { cat vanguard-import.log; exit 1; }
          cat vanguard-import.log
          grep -q "VANGUARD SKELETAL PLAY PASS" vanguard-import.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" vanguard-import.log
      - name: ARCONT tactical route and collision regression
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/tactical_validation.gd > tactical-nav.log 2>&1 || { cat tactical-nav.log; exit 1; }
          cat tactical-nav.log
          grep -q "TACTICAL NAV PASS" tactical-nav.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" tactical-nav.log
      - name: Test Quaternius active skeleton transitions in FISURA combat
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/animated_combat.gd > animated-combat.log 2>&1 || { cat animated-combat.log; exit 1; }
          cat animated-combat.log
          grep -q "ANIMATED COMBAT PASS" animated-combat.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" animated-combat.log
      - name: Verify animated eye drone attacks obey cover and ranged cooldown
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/ranged_drone.gd > drone-ranged.log 2>&1 || { cat drone-ranged.log; exit 1; }
          cat drone-ranged.log
          grep -q "DRONE RANGED PASS" drone-ranged.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" drone-ranged.log
      - name: Test real Vanguard humanoid movement shoot roll damage death
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/vanguard_gameplay.gd > vanguard-gameplay.log 2>&1 || { cat vanguard-gameplay.log; exit 1; }
          cat vanguard-gameplay.log
          grep -q "VANGUARD GAMEPLAY PASS" vanguard-gameplay.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" vanguard-gameplay.log
      - name: Verify additive Vanguard aim and multitouch controls
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/vanguard_aim_mobile.gd > vanguard-aim.log 2>&1 || { cat vanguard-aim.log; exit 1; }
          cat vanguard-aim.log
          grep -q "VANGUARD AIM PASS" vanguard-aim.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" vanguard-aim.log
      - name: Validate camera inside tall industrial walls
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/camera_bounds.gd > camera-bounds.log 2>&1 || { cat camera-bounds.log; exit 1; }
          cat camera-bounds.log
          grep -q "CAMERA OCCLUSION PASS" camera-bounds.log
      - name: Cross-validate Reactivo-13 mission map anchors with ARCONT
        run: |
          python3 _arcont_reference/tools/mission_map_bridge.py missions/reactivo_13.slice.json maps/reactivo_13.json | tee reactivo-bridge.log
          grep -q "MISSION MAP PASS" reactivo-bridge.log
      - name: Check Reactivo-13 static waypoint reachability in real Godot
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_navigation.gd > reactivo-nav.log 2>&1 || { cat reactivo-nav.log; exit 1; }
          cat reactivo-nav.log
          grep -q "REACTIVO NAV PASS" reactivo-nav.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" reactivo-nav.log
      - name: Test Reactivo-13 five-stage gameplay extraction
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_playthrough.gd > reactivo-playthrough.log 2>&1 || { cat reactivo-playthrough.log; exit 1; }
          cat reactivo-playthrough.log
          grep -q "REACTIVO PLAYTHROUGH PASS" reactivo-playthrough.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" reactivo-playthrough.log
      - name: Verify contextual cover / mobile traversal and dash recovery
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_cover_movement.gd > reactivo-cover.log 2>&1 || { cat reactivo-cover.log; exit 1; }
          cat reactivo-cover.log
          grep -q "REACTIVO COVER MOTION PASS" reactivo-cover.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" reactivo-cover.log
      - name: ARCONT touch regression - no accidental fire and shoulder camera
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_input_camera_regression.gd > input-camera.log 2>&1 || { cat input-camera.log; exit 1; }
          cat input-camera.log
          grep -q "REACTIVO MOBILE CAMERA PASS" input-camera.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" input-camera.log
      - name: ARCONT inspect multitouch button hitboxes and signal wiring (headless)
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_touch_buttons.gd > touch-buttons.log 2>&1 || { cat touch-buttons.log; exit 1; }
          cat touch-buttons.log
          grep -q "REACTIVO TOUCH BUTTONS PASS" touch-buttons.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" touch-buttons.log
      - name: ARCONT inspect procedural sound PCM and voice budget
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_audio_budget.gd > audio-budget.log 2>&1 || { cat audio-budget.log; exit 1; }
          cat audio-budget.log
          grep -q "REACTIVO AUDIO BUDGET PASS" audio-budget.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" audio-budget.log
      - name: Test Bulwark frontal armor and counterplay
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_bulwark.gd > reactivo-bulwark.log 2>&1 || { cat reactivo-bulwark.log; exit 1; }
          cat reactivo-bulwark.log
          grep -q "BULWARK SHIELD PASS" reactivo-bulwark.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" reactivo-bulwark.log
      - name: Verify EyeDrone warning and counterplay window in Reactivo
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_attack_telegraph.gd > reactivo-warning.log 2>&1 || { cat reactivo-warning.log; exit 1; }
          cat reactivo-warning.log
          grep -q "REACTIVO TELEGRAPH PASS" reactivo-warning.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" reactivo-warning.log
      - name: Confirm detailed CC0 industrial photogrammetry imports in Godot
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_cinematic_vendor_audit.gd > cinematic-import.log 2>&1 || { cat cinematic-import.log; exit 1; }
          cat cinematic-import.log
          grep -q "CINEMATIC PBR IMPORT PASS" cinematic-import.log
      - name: Verify ARCONT visual composition and real asset placement
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_visual_composition.gd > visual-composition.log 2>&1 || { cat visual-composition.log; exit 1; }
          cat visual-composition.log
          grep -q "REACTIVO VISUAL COMPOSITION PASS" visual-composition.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" visual-composition.log
      - name: Check cinematic stage geometry/light/collision budget
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/reactivo_art_budget.gd > reactivo-art-budget.log 2>&1 || { cat reactivo-art-budget.log; exit 1; }
          cat reactivo-art-budget.log
          grep -q "REACTIVO ART BUDGET PASS" reactivo-art-budget.log
          ! grep -E "SCRIPT ERROR|Parse Error|ERROR:" reactivo-art-budget.log
      - name: Run deterministic extraction playthrough
        run: |
          godot-bin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/playthrough.gd > godot-playthrough.log 2>&1
          cat godot-playthrough.log
          grep -q "PLAYTHROUGH PASS" godot-playthrough.log
          ! grep -E "SCRIPT ERROR|Parse Error|Invalid call|ERROR:" godot-playthrough.log
      - name: Capture true gameplay render (software OpenGL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libasound2t64
          xvfb-run -a -s '-screen 0 1280x720x24' godot-bin/Godot_v4.7.2-stable_linux.x86_64 --path . --script res://tests/capture.gd > render-capture.log 2>&1 || { cat render-capture.log; exit 1; }
          cat render-capture.log
          grep -q "RENDER PROOF PASS" render-capture.log
          test -s fisura-render-proof.png
          file fisura-render-proof.png
      - name: Capture real Reactivo-13 gameplay render
        run: |
          xvfb-run -a -s '-screen 0 1280x720x24' godot-bin/Godot_v4.7.2-stable_linux.x86_64 --path . --script res://tests/capture_reactivo.gd > reactivo-render.log 2>&1 || { cat reactivo-render.log; exit 1; }
          cat reactivo-render.log
          grep -q "REACTIVO RENDER PASS" reactivo-render.log
          test -s reactivo-13-render-proof.png
          test -s reactivo-13-node.png
          test -s reactivo-13-reactor.png
          test -s reactivo-13-bulwark.png
          test -s reactivo-13-cover.png
      - name: ARCONT verify five unique viewport artifacts at 1280x720
        run: |
          python3 _arcont_reference/tools/viewport_evidence_gate.py --min-width 1280 --min-height 720 reactivo-13-render-proof.png reactivo-13-node.png reactivo-13-reactor.png reactivo-13-bulwark.png reactivo-13-cover.png | tee reactivo-visual-evidence.log
          grep -q "VIEWPORT EVIDENCE PASS" reactivo-visual-evidence.log
      - name: Upload Reactivo-13 actual render proof
        uses: actions/upload-artifact@v4
        with:
          name: reactivo-13-actual-render
          path: |
            reactivo-13-render-proof.png
            reactivo-13-node.png
            reactivo-13-reactor.png
            reactivo-13-bulwark.png
            reactivo-13-cover.png
          if-no-files-found: error
      - name: Upload gameplay render proof
        uses: actions/upload-artifact@v4
        with:
          name: fisura-actual-render
          path: fisura-render-proof.png
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fisura-ci-logs
          path: |
            godot-import.log
            godot-smoke.log
            godot-playthrough.log
            reactivo-bridge.log
            reactivo-nav.log
            reactivo-playthrough.log
            reactivo-render.log
            reactivo-bulwark.log
            reactivo-cover.log
            input-camera.log
            audio-budget.log
            touch-buttons.log
            reactivo-warning.log
            reactivo-art-budget.log
            visual-composition.log
            cinematic-import.log
            reactivo-visual-evidence.log
            asset-integrity.log
            render-capture.log
            vendor-import.log
            tactical-nav.log
            camera-bounds.log
            quaternius-import.log
            animated-combat.log
            vanguard-import.log
            vanguard-gameplay.log
            vanguard-aim.log
            drone-ranged.log
          if-no-files-found: ignore
