name: FISURA 0.9.2 verified Kenney CC0 OGG intake

on:
  push:
    branches: [feat/fisura-092-cover-peek-vault-kenney-audio]
    paths:
      - 'tools/audio/kenney_intake.py'
      - '.github/workflows/fisura-audio-intake.yml'

permissions:
  contents: write

jobs:
  verified-audio-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Verify CC0 source SHA and audio format before vendoring
        run: |
          python3 tools/audio/kenney_intake.py
          python3 -m json.tool assets/vendor/kenney_sfx/PROVENANCE.json > /dev/null
      - name: Commit source-traced OGG assets onto the feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/vendor/kenney_sfx
          if ! git diff --cached --quiet; then
            git commit -m 'assets(audio): source-verified Kenney CC0 OGG sound set'
            git push origin HEAD:feat/fisura-092-cover-peek-vault-kenney-audio
          fi
